<!DOCTYPE html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<!-- English UI with Japanese in it: never machine-translated (Chrome took the
     page for Japanese and "translated" the start card) -->
<meta name="google" content="notranslate" />
<title>Take Me Back to Japan</title>
<meta name="description" content="A first-person stroll through Fujikawaguchikko, a small Japanese town under Mt. Fuji: a konbini at golden hour, cherry blossom, a shrine, a local train. In your browser, on a desktop." />
<link rel="canonical" href="https://takemebacktojapan.com/" />
<meta property="og:type" content="website" />
<meta property="og:site_name" content="Take Me Back to Japan" />
<meta property="og:title" content="Take Me Back to Japan" />
<meta property="og:description" content="A small town under Mt. Fuji. Walk it at golden hour, in your browser." />
<meta property="og:url" content="https://takemebacktojapan.com/" />
<meta property="og:image" content="https://takemebacktojapan.com/og.jpg" />
<meta property="og:image:type" content="image/jpeg" />
<meta property="og:image:width" content="1200" />

<meta property="og:image:alt" content="Take Me Back to Japan: the NIPPON konbini at golden hour with Mt. Fuji rising behind it." />

<meta property="og:image:width" content="1200" />

<meta name="twitter:description" content="A small town under Mt. Fuji. Walk it at golden hour, in your browser." />
<meta name="twitter:image" content="https://takemebacktojapan.com/og.jpg" />
<meta name="twitter:image:alt" content="Take Me Back to Japan: the NIPPON konbini at golden hour with Mt. Fuji rising behind it." />
<meta name="theme-color" content="#3b3263" />
<link rel="icon" href="favicon.ico" sizes="48x48" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />
<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<link rel="preload" as="image" href="keyart.webp" type="image/webp" fetchpriority="high" />
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #e6ecf7;
    font-family: 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Segoe UI', system-ui, sans-serif;
    color: #3a3350;
  }
  #view { display: block; width: 100vw; height: 100vh; }

  .hud { position: fixed; inset: 0; pointer-events: none; }
  /* paused, the game's own captions (Hachi's hello) wait under the card, and come back on resume */
  body.game-paused #hachi-card { visibility: hidden; }

  /* ---------- crosshair ---------- */
  .crosshair {
    position: absolute; left: 50%; top: 50%;
    width: 6px; height: 6px; margin: -3px 0 0 -3px;
    border-radius: 50%;
    background: rgba(255,255,255,.85);
    box-shadow: 0 0 0 1.5px rgba(58,51,80,.55);
    opacity: 0; transition: opacity .3s ease;
  }
  .crosshair.on { opacity: .8; }
  .crosshair.hidden { opacity: 0; }

  /* ---------- interaction prompt ---------- */
  .prompt {
    position: absolute; left: 50%; bottom: 15%;
    transform: translate(-50%, 8px);
    padding: 8px 18px; border-radius: 999px;
    background: rgba(252,250,252,.82);
    border: 1.5px solid rgba(58,51,80,.35);
    font-size: 14px; font-weight: 600; letter-spacing: .02em;
    white-space: nowrap;
    opacity: 0; transition: opacity .18s ease, transform .18s ease;
  }
  .prompt.on { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- transient toast (music on/off) ---------- */
  .toast {
    position: absolute; left: 50%; top: 12%;
    transform: translate(-50%, -6px);
    padding: 7px 16px; border-radius: 999px;
    background: rgba(252,250,252,.8);
    border: 1.5px solid rgba(58,51,80,.3);
    font-size: 15px; font-weight: 600; letter-spacing: .02em;
    white-space: nowrap; color: #4c4568;
    z-index: 7;   /* above the pause card: blurred under it, "Sound off" read as "comm off" (Tan) */
    opacity: 0; transition: opacity .25s ease, transform .25s ease;
  }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
  .toast.err { background: rgba(255,238,236,.94); border-color: rgba(208,52,47,.6); color: #b0282a; }

  /* ---------- coordinate readout (C) ---------- */
  .coords {
    position: absolute; right: 16px; bottom: 14px;
    font-family: ui-monospace, 'SFMono-Regular', 'Cascadia Mono', Consolas, monospace;
    font-size: 12px; line-height: 1.55; text-align: right;
    padding: 8px 12px; border-radius: 8px;
    background: rgba(252,250,252,.62);
    border: 1px solid rgba(58,51,80,.16);
    color: #3f3a58;
    opacity: 0; visibility: hidden;
    transition: opacity .18s ease, visibility .18s ease;
    white-space: nowrap;
  }
  .coords.on { opacity: 1; visibility: visible; }
  .coords .k { color: #8f88a8; margin-right: .12em; }
  .coords .d { color: #8f88a8; }
  .coords .s { color: #5d6f96; font-size: 11px; }

  /* ---------- reference overlay (dev only, ` key) ----------
   * Fitted by height and centred, like the hero lens. */
  .ref-overlay {
    position: fixed; top: 0; left: 50%; height: 100vh; width: auto;
    transform: translateX(-50%);
    opacity: 0; pointer-events: none; z-index: 5;
  }
  .ref-overlay.on { opacity: .5; }

  /* ---------- start / pause card ----------
   * One card for both (core/hud.js): the key art with the name over its sky,
   * then the keys and Start (paused: the volume and Resume).  Sized to the
   * window, never scrolled; the type scales with the card (cqw). */
  .overlay {
    position: absolute; inset: 0; pointer-events: auto;
    display: grid; place-items: center;
    background: radial-gradient(ellipse at 50% 40%, rgba(40,30,62,.42), rgba(18,14,32,.72));
    backdrop-filter: blur(10px) saturate(.9);
    transition: opacity .4s ease, visibility .4s ease;
    cursor: pointer;
  }
  .overlay.hidden { opacity: 0; visibility: hidden; }
  .pause-only { display: none; }
  .overlay[data-mode='paused'] .start-only { display: none; }
  .overlay[data-mode='paused'] .pause-only { display: revert; }
  .overlay[data-mode='paused'] .audio-control { display: block; }

  .menu {
    --ink: #2b2542;
    --ink-soft: #6c6482;
    --paper: #fbf6f0;
    --sakura: #e59bb0;
    --action: #3b3263;
    container-type: inline-size;
    width: min(66vw, calc((100vh - 236px) * 16 / 9), 1500px);
    min-width: 760px;
    border-radius: 18px; overflow: hidden;
    background: var(--paper); color: var(--ink);
    box-shadow: 0 40px 110px -30px rgba(8,4,24,.75), 0 0 0 1px rgba(255,255,255,.08);
    cursor: default;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  }
  .menu [lang='ja'] { font-family: 'NF Round', 'Hiragino Maru Gothic ProN', 'Hiragino Sans', 'Yu Gothic UI', 'Yu Gothic', Meiryo, sans-serif; }

  .menu-art { position: relative; margin: 0; aspect-ratio: 16 / 9; background: #b98ab4; }
  .menu-art img { display: block; width: 100%; height: 100%; object-fit: cover; }
  /* the name sits in the clear sky right of Fuji's peak */
  .menu-name {
    position: absolute; right: 4cqw; top: 4cqw;
    text-align: right; color: var(--ink);
  }
  .menu-place {
    margin: 0 0 .9cqw; font-size: max(10.5px, 1.05cqw); font-weight: 700;
    letter-spacing: .24em; text-transform: uppercase; color: rgba(43,37,66,.72);
  }
  .menu-place [lang='ja'] { letter-spacing: .12em; text-transform: none; }
  .menu-place .dot { margin: 0 .7em; color: rgba(43,37,66,.45); }
  .menu h1 {
    margin: 0; font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, 'Book Antiqua', Georgia, serif;
    font-size: 4.1cqw; line-height: 1.05; font-weight: 600; letter-spacing: -.005em; white-space: nowrap;
    color: #2a2140; text-shadow: 0 1px 0 rgba(255,236,230,.35);
  }
  .menu-jp {
    margin: 1.1cqw 0 0; font-size: max(14px, 1.7cqw); font-weight: 700; letter-spacing: .32em;
    color: rgba(43,37,66,.8);
  }
  .menu-jp::before {
    content: ''; display: inline-block; width: 3.2cqw; height: 2px; margin: 0 1.1cqw .45cqw 0;
    vertical-align: middle; background: linear-gradient(90deg, transparent, var(--sakura));
  }
  .menu-paused {
    position: absolute; left: 2.4cqw; top: 2.4cqw;
    padding: .55cqw 1.3cqw; border-radius: 999px;
    background: rgba(251,246,240,.9); color: var(--ink);
    font-size: max(11px, 1.05cqw); font-weight: 700; letter-spacing: .22em; text-transform: uppercase;
    box-shadow: 0 6px 18px -8px rgba(20,10,40,.5);
  }

  .menu-body {
    display: grid; grid-template-columns: 1fr 24cqw; gap: 3.2cqw;
    padding: 2.3cqw 3cqw 2.2cqw;
    border-top: 3px solid var(--sakura);
    background: linear-gradient(180deg, #fffaf5, var(--paper));
  }
  .menu-tagline { margin: 0 0 1.5cqw; font-size: max(13px, 1.3cqw); line-height: 1.4; color: var(--ink-soft); }
  .menu-keys {
    list-style: none; margin: 0; padding: 0;
    display: grid; grid-template-columns: repeat(4, auto); justify-content: start;
    gap: 1.05cqw 2.4cqw;
  }
  .menu-keys li { display: flex; align-items: center; gap: .9cqw; white-space: nowrap; }
  .menu-keys .caps { display: flex; gap: .3cqw; }
  .menu-keys .what { font-size: max(12.5px, 1.12cqw); font-weight: 600; color: var(--ink); }
  .menu kbd {
    display: inline-grid; place-items: center;
    min-width: max(22px, 2.05cqw); height: max(22px, 2.05cqw); padding: 0 .5cqw;
    border-radius: .45cqw;
    background: linear-gradient(#ffffff, #f4eef0);
    border: 1px solid #d9cfd8; border-bottom: .22cqw solid #c7bac8;
    font: 700 max(11px, 1cqw)/1 -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    color: var(--ink);
  }
  .menu kbd.wide { padding: 0 max(7px, .75cqw); font-size: max(10px, .88cqw); letter-spacing: .02em; }

  .menu-right { display: flex; flex-direction: column; justify-content: flex-end; gap: 1.1cqw; }
  .audio-control { cursor: default; }
  .audio-head {
    display: flex; justify-content: space-between; margin-bottom: .6cqw;
    font-size: max(12px, 1.05cqw); font-weight: 700; color: var(--ink);
  }
  .audio-head output { font-variant-numeric: tabular-nums; color: var(--ink-soft); font-weight: 600; }
  .audio-control.muted .audio-head span::after { content: ' (muted)'; color: var(--ink-soft); font-weight: 400; }
  .volume-slider { display: block; width: 100%; margin: 0; accent-color: var(--action); cursor: pointer; }
  .menu-action {
    width: 100%; padding: 1.05cqw 1.4cqw;
    border: 0; border-radius: .8cqw;
    color: #fff; background: var(--action);
    font: inherit; font-size: max(14px, 1.35cqw); font-weight: 700; letter-spacing: .08em;
    cursor: pointer;
    box-shadow: 0 .5cqw 1.4cqw -.6cqw rgba(40,24,80,.6);
    transition: background .15s ease, transform .15s ease;
  }
  .menu-action:hover { background: #4b3f7c; transform: translateY(-1px); }
  .menu-action:focus-visible { outline: 3px solid var(--sakura); outline-offset: 3px; }
  .menu-url {
    margin: 0; text-align: center;
    font-size: max(11px, .95cqw); font-weight: 600; letter-spacing: .08em; color: var(--ink-soft);
  }
  .menu-credit { display: block; margin-top: .3cqw; font-size: max(10px, .78cqw); font-weight: 500; letter-spacing: .02em; opacity: .75; }
  .menu-credit a { color: inherit; text-underline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    .overlay, .menu-action { transition: none; }
  }
</style>
</head>
<body class="notranslate">
  <canvas id="view"></canvas>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
