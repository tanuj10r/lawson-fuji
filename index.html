<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nippon Fuji</title>
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #e6ecf7;
    font-family: 'Yu Gothic UI', 'Yu Gothic', Meiryo, 'Segoe UI', system-ui, sans-serif;
    color: #3a3350;
  }
  #view { display: block; width: 100vw; height: 100vh; }

  .hud { position: fixed; inset: 0; pointer-events: none; }

  /* ---------- crosshair ---------- */
  .crosshair {
    position: absolute; left: 50%; top: 50%;
    width: 6px; height: 6px; margin: -3px 0 0 -3px;
    border-radius: 50%;
    background: rgba(255,255,255,.85);
    box-shadow: 0 0 0 1.5px rgba(58,51,80,.55);
    opacity: 0; transition: opacity .3s ease;
  }
  .crosshair.on { opacity: .8; }
  .crosshair.hidden { opacity: 0; }

  /* ---------- interaction prompt ---------- */
  .prompt {
    position: absolute; left: 50%; bottom: 15%;
    transform: translate(-50%, 8px);
    padding: 8px 18px; border-radius: 999px;
    background: rgba(252,250,252,.82);
    border: 1.5px solid rgba(58,51,80,.35);
    font-size: 14px; font-weight: 600; letter-spacing: .02em;
    white-space: nowrap;
    opacity: 0; transition: opacity .18s ease, transform .18s ease;
  }
  .prompt.on { opacity: 1; transform: translate(-50%, 0); }

  /* ---------- transient toast (music on/off) ---------- */
  .toast {
    position: absolute; left: 50%; top: 12%;
    transform: translate(-50%, -6px);
    padding: 7px 16px; border-radius: 999px;
    background: rgba(252,250,252,.8);
    border: 1.5px solid rgba(58,51,80,.3);
    font-size: 15px; font-weight: 600; letter-spacing: .02em;
    white-space: nowrap; color: #4c4568;
    z-index: 7;   /* above the pause card: blurred under it, "Sound off" read as "comm off" (Tan) */
    opacity: 0; transition: opacity .25s ease, transform .25s ease;
  }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
  .toast.err { background: rgba(255,238,236,.94); border-color: rgba(208,52,47,.6); color: #b0282a; }

  /* ---------- coordinate readout (C) ---------- */
  .coords {
    position: absolute; right: 16px; bottom: 14px;
    font-family: ui-monospace, 'SFMono-Regular', 'Cascadia Mono', Consolas, monospace;
    font-size: 12px; line-height: 1.55; text-align: right;
    padding: 8px 12px; border-radius: 8px;
    background: rgba(252,250,252,.62);
    border: 1px solid rgba(58,51,80,.16);
    color: #3f3a58;
    opacity: 0; visibility: hidden;
    transition: opacity .18s ease, visibility .18s ease;
    white-space: nowrap;
  }
  .coords.on { opacity: 1; visibility: visible; }
  .coords .k { color: #8f88a8; margin-right: .12em; }
  .coords .d { color: #8f88a8; }
  .coords .s { color: #5d6f96; font-size: 11px; }

  /* ---------- reference overlay (dev only, R) ----------
   * Fitted by height and centred, like the hero lens. */
  .ref-overlay {
    position: fixed; top: 0; left: 50%; height: 100vh; width: auto;
    transform: translateX(-50%);
    opacity: 0; pointer-events: none; z-index: 5;
  }
  .ref-overlay.on { opacity: .5; }

  /* ---------- start / pause card ----------
   * A plain placeholder until the real title screen (SPEC M7). */
  .overlay {
    position: absolute; inset: 0; pointer-events: auto;
    display: grid; place-items: center;
    background: rgba(28,32,52,.38);
    backdrop-filter: blur(6px);
    transition: opacity .35s ease, visibility .35s ease;
  }
  .overlay.hidden { opacity: 0; visibility: hidden; }
  .pause-only { display: none; }
  .overlay[data-mode='paused'] .start-only { display: none; }
  .overlay[data-mode='paused'] .pause-only { display: initial; }
  .overlay[data-mode='paused'] .pause-stack { display: grid; }

  .menu-panel {
    --ink: #2c3048;
    width: min(440px, calc(100vw - 48px));
    padding: 32px 34px 28px;
    color: var(--ink);
    background: rgba(250,250,252,.94);
    border-radius: 12px;
    box-shadow: 0 24px 60px -24px rgba(20,22,40,.6);
  }
  .menu-panel h1 { margin: 0; font-size: 34px; font-weight: 800; letter-spacing: -.02em; }
  .menu-jp { margin: 4px 0 20px; font-size: 15px; letter-spacing: .2em; color: #6a6e86; }
  .menu-description { margin: 0 0 18px; font-size: 13px; line-height: 1.6; color: #5a5e76; }
  .control-strip { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-bottom: 20px; font-size: 12px; color: #5a5e76; }
  .control-strip b {
    display: inline-block; min-width: 20px; padding: 1px 5px; margin-right: 4px;
    border: 1px solid #c4c6d4; border-radius: 4px; background: #fff;
    font-family: ui-monospace, 'SFMono-Regular', Consolas, monospace; font-size: 11px;
    text-align: center; color: var(--ink);
  }
  .audio-control { margin: 0 0 18px; }
  .audio-head {
    display: flex; justify-content: space-between; margin-bottom: 6px;
    font-size: 12px; font-weight: 700;
  }
  .audio-head output { font-family: ui-monospace, 'SFMono-Regular', Consolas, monospace; color: #6a6e86; }
  .audio-control.muted .audio-head span::after { content: ' (muted)'; color: #8a8ea6; font-weight: 400; }
  .volume-slider { display: block; width: 100%; margin: 0; accent-color: var(--ink); }
  .menu-action {
    width: 100%; padding: 11px 14px;
    border: 0; border-radius: 8px;
    color: #fff; background: var(--ink);
    font: inherit; font-size: 14px; font-weight: 700; letter-spacing: .04em;
    cursor: pointer;
  }
  .menu-action:hover { background: #3c4262; }
  .menu-action:focus-visible { outline: 3px solid #9aa0c8; outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) {
    .overlay { transition: none; }
  }
</style>
</head>
<body>
  <canvas id="view"></canvas>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
