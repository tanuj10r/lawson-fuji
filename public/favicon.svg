<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Take Me Back to Japan: the town's design manhole lid (src/world/kit/street/atlas.js mhFuji),
       with the famous view cast into it at golden hour: Mt. Fuji rising behind the NIPPON konbini. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5c4ea4"/>
      <stop offset=".5" stop-color="#a77fbe"/>
      <stop offset=".78" stop-color="#f4bd98"/>
    </linearGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a86d4"/>
      <stop offset=".3" stop-color="#0068b7"/>
      <stop offset="1" stop-color="#00509a"/>
    </linearGradient>
    <clipPath id="face"><circle cx="50" cy="50" r="37"/></clipPath>
  </defs>
  <!-- the cast frame and its studded rim -->
  <circle cx="50" cy="50" r="49.5" fill="#4a4558"/>
  <circle cx="50" cy="50" r="47" fill="#8b8698"/>
  <circle cx="50" cy="50" r="42.5" fill="none" stroke="#5c5770" stroke-width="4.2" stroke-dasharray="2.1 2.1"/>
  <circle cx="50" cy="50" r="39" fill="#3a3550"/>
  <g clip-path="url(#face)">
    <rect x="0" y="0" width="100" height="100" fill="url(#sky)"/>
    <!-- Fuji -->
    <path d="M4 74 L41 25 Q50 22 59 25 L96 74 Z" fill="#6f5fae"/>
    <path d="M41 25 Q50 22 59 25 L67.5 36.5 L63 34 L60 38.5 L55.5 34.5 L50 39.5 L45 34.5 L40.5 38.5 L37 34 L32.5 36.5 Z" fill="#fbe3ea"/>
    <path d="M4 74 L41 25 Q50 22 59 25 L96 74" fill="none" stroke="#282438" stroke-opacity=".6" stroke-width="1.6" stroke-linejoin="round"/>
    <!-- sakura sprays either side -->
    <g fill="#f7a9c2">
      <circle cx="19" cy="33" r="4.2"/><circle cx="24.5" cy="28" r="3.6"/><circle cx="15" cy="40" r="3.4"/><circle cx="25" cy="36" r="2.8"/>
      <circle cx="81" cy="33" r="4.2"/><circle cx="75.5" cy="28" r="3.6"/><circle cx="85" cy="40" r="3.4"/><circle cx="75" cy="36" r="2.8"/>
    </g>
    <g fill="#f8e070">
      <circle cx="19" cy="33" r="1.1"/><circle cx="24.5" cy="28" r="1"/><circle cx="81" cy="33" r="1.1"/><circle cx="75.5" cy="28" r="1"/>
    </g>
    <!-- the konbini: sign band with the name, lit glass front -->
    <rect x="0" y="76" width="100" height="24" fill="#9c97aa"/>
    <rect x="21" y="57" width="58" height="20" fill="#e4e8ee"/>
    <rect x="21" y="57" width="58" height="9" fill="url(#band)"/>
    <rect x="21" y="57" width="58" height="1.1" fill="#f4f8fc"/>
    <rect x="36" y="58.8" width="28" height="5.6" rx=".5" fill="#ffffff"/>
    <text x="50" y="63.35" text-anchor="middle" font-family="Rockwell, Georgia, serif" font-weight="900" font-size="5" textLength="23" lengthAdjust="spacingAndGlyphs" fill="#0068b7">NIPPON</text>
    <rect x="24" y="67.5" width="52" height="9.5" fill="#ffe7a8"/>
    <g fill="#3a3550">
      <rect x="36.3" y="67.5" width="1.3" height="9.5"/><rect x="49.35" y="67.5" width="1.3" height="9.5"/><rect x="62.4" y="67.5" width="1.3" height="9.5"/>
    </g>
    <rect x="21" y="57" width="58" height="20" fill="none" stroke="#282438" stroke-opacity=".6" stroke-width="1.3"/>
    <!-- the kerb -->
    <rect x="0" y="77" width="100" height="1.5" fill="#f6f4f8" fill-opacity=".85"/>
  </g>
  <circle cx="50" cy="50" r="37" fill="none" stroke="#282438" stroke-opacity=".7" stroke-width="1.6"/>
</svg>
